[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "facefuse"
version = "1.0.0"
description = "Quality-adaptive hybrid face recognition: YOLO11 detection, InsightFace embeddings and LBP/HOG descriptors fused by image sharpness, tuned with a genetic algorithm."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "Ahmed Sayed" }]
keywords = [
    "face-recognition",
    "face-detection",
    "computer-vision",
    "insightface",
    "yolo",
    "feature-fusion",
    "lbp",
    "hog",
    "genetic-algorithm",
    "biometrics",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.8,<5",  # cv2.HOGDescriptor was removed in OpenCV 5
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "torch>=2.0",
    "ultralytics>=8.3",
    "insightface>=0.7",
    "onnxruntime>=1.16",
]

[project.optional-dependencies]
gpu = ["onnxruntime-gpu>=1.16"]
dev = ["pytest>=7.4", "ruff>=0.6", "scikit-image>=0.21"]

[project.scripts]
facefuse = "facefuse.cli:main"

[project.urls]
Homepage = "https://github.com/ahmedsayed1911/facefuse-hybrid-face-recognition"
Source = "https://github.com/ahmedsayed1911/facefuse-hybrid-face-recognition"
Issues = "https://github.com/ahmedsayed1911/facefuse-hybrid-face-recognition/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B905"]
