name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: lint + tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test dependencies
        # The unit tests cover the algorithmic core: LBP/HOG extraction, the
        # fusion rule, the genetic optimiser, metrics and the CLI surface.
        # Torch, ultralytics and insightface are deliberately not installed —
        # they are multi-gigabyte downloads and every test that would need them
        # requires model weights and face images that this repository does not
        # (and must not) ship.
        run: |
          python -m pip install --upgrade pip
          pip install numpy "opencv-python-headless>=4.8,<5" scikit-learn matplotlib pytest ruff
          pip install -e . --no-deps

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

      - name: Check the package builds
        run: |
          pip install build
          python -m build --wheel
